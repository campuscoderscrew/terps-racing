<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TR Image Tagger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23e21833%27/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0e0e10; --panel: #17171b; --panel-2: #1f1f25; --line: #2c2c34;
    --text: #ececf1; --muted: #9a9aa6; --red: #e21833; --gold: #ffd200; --ok: #3ecf8e;
    --radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-size: 14px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  kbd { font: 11px ui-monospace, monospace; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

  /* ── top bar ── */
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .brand { font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .brand b { color: var(--red); }
  .progress { display: flex; align-items: center; gap: 10px; min-width: 220px; flex: 1; max-width: 420px; }
  .bar { flex: 1; height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); width: 0; transition: width .3s; }
  .progress span { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; background: var(--panel-2); border-radius: 8px; padding: 3px; gap: 2px; }
  .tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; color: var(--muted); }
  .tabs button.on { background: var(--red); color: #fff; }
  .tabs button .n { opacity: .7; font-size: 12px; margin-left: 4px; }
  .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .status.saved { color: var(--ok); }
  .status.err { color: var(--red); }

  /* ── editor ── */
  .editor { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  .stage { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; min-width: 0; }
  .crumbs { padding: 10px 16px; color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; overflow: hidden; }
  .crumbs .file { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs .dir { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .badge.tagged { background: rgba(62,207,142,.15); color: var(--ok); }
  .badge.dirty { background: rgba(255,210,0,.15); color: var(--gold); }
  .view { position: relative; display: grid; place-items: center; min-height: 0; padding: 8px 16px; background:
      repeating-conic-gradient(#141418 0 25%, #18181d 0 50%) 0 0 / 24px 24px; }
  .view img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .noprev { text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
  .noprev .ext { font: 800 42px ui-monospace, monospace; color: var(--text); }
  .controls { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); padding: 8px 14px; border-radius: 8px; display: inline-flex; gap: 8px; align-items: center; }
  .btn:hover { border-color: #444450; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn kbd { background: rgba(0,0,0,.25); border-color: rgba(255,255,255,.15); color: inherit; }
  .pos { color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 6px; }

  /* ── tag panel ── */
  aside { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto auto auto 1fr auto; min-height: 0; }
  aside h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .sec { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 26px; }
  .chip { font-size: 12px; padding: 3px 8px 3px 10px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
  .chip .p { color: var(--muted); }
  .chip.folder { border-color: rgba(255,210,0,.35); }
  .chip.custom { border-color: rgba(226,24,51,.45); }
  .chip button { border: 0; background: none; color: var(--muted); padding: 0 2px; line-height: 1; }
  .chip button:hover { color: var(--text); }
  .chip.quick { cursor: pointer; }
  .chip.quick:hover { background: #2a2a31; }
  .chip.quick.on { background: rgba(226,24,51,.2); }
  .empty { color: var(--muted); font-size: 12px; }
  .search { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: none; }
  .search:focus { border-color: var(--red); }
  .row-tools { display: flex; gap: 6px; margin-top: 8px; }
  .row-tools .btn { padding: 4px 10px; font-size: 12px; }

  .tree { overflow: auto; padding: 6px 6px 16px; min-height: 0; }
  .node { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; }
  .node:hover { background: var(--panel-2); }
  .node:hover .acts { visibility: visible; }
  .twist { width: 18px; height: 18px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; flex: none; }
  .twist.leaf { visibility: hidden; }
  .node label { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; padding: 2px 0; }
  .node input { accent-color: var(--red); width: 15px; height: 15px; flex: none; margin: 0; }
  .node .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .ico { font-size: 12px; flex: none; opacity: .8; }
  .node .count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .node.own .name { color: var(--gold); }
  .node.match .name { text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 3px; }
  .acts { visibility: hidden; display: flex; gap: 2px; }
  .acts button { border: 0; background: none; color: var(--muted); padding: 2px 5px; border-radius: 4px; font-size: 12px; }
  .acts button:hover { background: var(--line); color: var(--text); }
  .children { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 4px; }
  .newtag { display: flex; gap: 6px; padding: 4px 6px 4px 28px; }
  .newtag input { flex: 1; background: var(--bg); border: 1px solid var(--red); border-radius: 6px; padding: 4px 8px; outline: none; min-width: 0; }
  .help { padding: 10px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.8; }

  /* ── review grid ── */
  .review { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .filters { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .filters .search { max-width: 360px; }
  .filters .active { display: flex; gap: 6px; flex-wrap: wrap; }
  .grid { overflow: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: grid; grid-template-rows: 160px auto; text-align: left; padding: 0; }
  .card:hover { border-color: var(--red); }
  .card .thumb { background: #111; display: grid; place-items: center; overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .thumb .ext { font: 800 22px ui-monospace, monospace; color: var(--muted); }
  .card .meta { padding: 8px 10px 10px; display: grid; gap: 6px; }
  .card .fn { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .chips { margin: 0; min-height: 0; }
  .card .chip { font-size: 11px; padding: 1px 7px; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; border-top: 1px solid var(--line); }
  .banner { margin: 16px; padding: 14px 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); }
  .banner.done { border-color: var(--ok); }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .editor { grid-template-columns: 1fr; grid-template-rows: 55vh auto; overflow: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>TR</b> Image Tagger</div>
    <div class="progress" title="Images with an entry in tags.json">
      <div class="bar"><i id="bar"></i></div>
      <span id="progressText">–</span>
    </div>
    <div class="tabs" role="tablist">
      <button data-mode="todo" class="on">To tag<span class="n" id="nTodo"></span></button>
      <button data-mode="review">Review tagged<span class="n" id="nDone"></span></button>
      <button data-mode="all">All<span class="n" id="nAll"></span></button>
    </div>
    <div class="spacer"></div>
    <span class="status" id="status">Loading…</span>
  </header>

  <!-- editor: one image at a time -->
  <main class="editor" id="editor">
    <section class="stage">
      <div class="crumbs">
        <span class="file" id="fileName"></span>
        <span class="badge" id="stateBadge"></span>
        <span class="dir" id="dirName"></span>
        <span class="spacer"></span>
        <button class="btn hidden" id="backToGrid" style="padding:4px 10px;font-size:12px">← Back to grid</button>
      </div>
      <div class="view" id="view"></div>
      <div class="controls">
        <button class="btn" id="prevBtn" title="Previous image">← Prev <kbd>←</kbd></button>
        <span class="pos" id="pos"></span>
        <button class="btn" id="nextBtn" title="Next image">Next → <kbd>→</kbd></button>
        <span class="spacer"></span>
        <button class="btn" id="copyBtn" title="Apply the tags from the last image you saved">Copy last tags <kbd>C</kbd></button>
        <button class="btn hidden" id="untagBtn" title="Remove this image from tags.json so it shows up in To tag again">Mark untagged</button>
        <button class="btn primary" id="saveBtn">Save &amp; next <kbd>Enter</kbd></button>
      </div>
    </section>

    <aside>
      <div class="sec">
        <h3>On this image</h3>
        <div class="chips" id="selected"></div>
      </div>
      <div class="sec" id="quickSec">
        <h3>Quick tags</h3>
        <div class="chips" id="quick"></div>
      </div>
      <div class="sec">
        <input class="search" id="tagSearch" placeholder="Find or create a tag…  ( / )" autocomplete="off" />
        <div class="row-tools">
          <button class="btn" id="newRootTag">+ Top-level tag</button>
          <button class="btn" id="expandAll">Expand all</button>
          <button class="btn" id="collapseAll">Collapse</button>
        </div>
      </div>
      <div class="tree" id="tree"></div>
      <div class="help">
        <kbd>Enter</kbd> save &amp; next · <kbd>←</kbd><kbd>→</kbd> move · <kbd>C</kbd> copy last tags · <kbd>/</kbd> find tag<br />
        📁 folder tags are pre-checked from where the file lives — untick one if the image is filed in the wrong place.
        Ticking a tag ticks its parents; unticking a tag unticks its children.
      </div>
    </aside>
  </main>

  <!-- review: grid of tagged images -->
  <main class="review hidden" id="review">
    <div class="filters">
      <input class="search" id="reviewSearch" placeholder="Filter by file name or tag…" autocomplete="off" />
      <div class="active" id="activeFilters"></div>
      <span class="spacer"></span>
      <span class="status" id="reviewCount"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<script>
/* ───────────────────────── state ───────────────────────── */
const S = {
  images: [],            // [{path, ext, previewable}]
  folders: [],           // folder tag ids
  records: new Map(),    // path -> tags[]
  customTags: [],        // custom tag ids
  mode: "todo",          // todo | review | all
  queue: [],             // image paths for the current mode
  idx: 0,
  current: null,         // path
  working: new Set(),    // tags being edited for current image
  dirty: false,
  expanded: new Set(),
  lastSaved: null,       // tags of the most recently saved image
  lastSavedPath: null,
  tagFilter: new Set(),  // review filters (exact tag ids)
  reviewText: "",
  reviewPage: 0,
  inGrid: true,          // review mode: showing grid vs editor
  addingUnder: undefined // tag id (or "" for top level) while the new-tag input is open
};
const PAGE = 48;
const $ = (id) => document.getElementById(id);
const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
const leaf = (t) => t.split("/").pop();
const parentOf = (t) => (t.includes("/") ? t.slice(0, t.lastIndexOf("/")) : "");
const ancestors = (t) => { const out = []; let p = parentOf(t); while (p) { out.push(p); p = parentOf(p); } return out; };
const folderOf = (p) => parentOf(p);
const folderTagsFor = (p) => { const f = folderOf(p); return f ? [f, ...ancestors(f)] : []; };
const imgUrl = (p) => "/img?p=" + encodeURIComponent(p);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(url, body) {
  const res = await fetch(url, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}
function status(text, kind = "") { const el = $("status"); el.textContent = text; el.className = "status " + kind; }

/* ───────────────────────── load ───────────────────────── */
async function load() {
  const st = await api("/api/state");
  S.images = st.images;
  S.folders = st.folders;
  S.customTags = st.customTags;
  S.records = new Map(st.records.map((r) => [r.path, r.tags]));
  const missing = st.records.filter((r) => !st.images.some((i) => i.path === r.path)).length;
  status(missing ? `${missing} tagged file(s) no longer on disk — kept in tags.json` : `Saving to ${st.tagsFile}`);
  const last = st.records[st.records.length - 1];
  S.lastSaved = last ? [...last.tags] : null;
  S.lastSavedPath = last ? last.path : null;
  setMode("todo");
}

/* ───────────────────────── tags ───────────────────────── */
function allTagIds() {
  const set = new Set([...S.folders, ...S.customTags]);
  for (const tags of S.records.values()) tags.forEach((t) => set.add(t));
  S.working.forEach((t) => set.add(t));
  // make sure every ancestor exists as a node
  for (const t of [...set]) ancestors(t).forEach((a) => set.add(a));
  return [...set].sort(collator.compare);
}
const folderSet = () => new Set(S.folders);
function usage() {
  const u = new Map();
  for (const tags of S.records.values()) tags.forEach((t) => u.set(t, (u.get(t) || 0) + 1));
  return u;
}
function buildTree(ids) {
  const nodes = new Map();
  const roots = [];
  for (const id of ids) nodes.set(id, { id, children: [] });
  for (const id of ids) {
    const p = parentOf(id);
    if (p && nodes.has(p)) nodes.get(p).children.push(nodes.get(id));
    else roots.push(nodes.get(id));
  }
  return roots;
}
function check(tag) { S.working.add(tag); ancestors(tag).forEach((a) => S.working.add(a)); markDirty(); }
function uncheck(tag) { for (const t of [...S.working]) if (t === tag || t.startsWith(tag + "/")) S.working.delete(t); markDirty(); }
function toggle(tag) { S.working.has(tag) ? uncheck(tag) : check(tag); renderTagPanel(); }
function markDirty() { S.dirty = true; renderBadge(); }

async function createTag(parent, name) {
  name = name.trim().replace(/\//g, "-");
  if (!name) return;
  const id = parent ? `${parent}/${name}` : name;
  if (!allTagIds().includes(id)) {
    const next = [...new Set([...S.customTags, id])];
    const r = await api("/api/custom-tags", { tags: next });
    S.customTags = r.customTags;
  }
  S.expanded.add(parent); ancestors(parent).forEach((a) => S.expanded.add(a));
  check(id);
  S.addingUnder = undefined;
  $("tagSearch").value = "";
  renderTagPanel();
  status(`Created tag “${id}”`, "saved");
}
async function renameTag(id) {
  const name = prompt(`Rename “${leaf(id)}” to:`, leaf(id));
  if (!name || name === leaf(id)) return;
  const to = (parentOf(id) ? parentOf(id) + "/" : "") + name.trim().replace(/\//g, "-");
  await api("/api/rename-tag", { from: id, to });
  const swap = (t) => (t === id ? to : t.startsWith(id + "/") ? to + t.slice(id.length) : t);
  S.customTags = S.customTags.map(swap);
  for (const [p, tags] of S.records) S.records.set(p, tags.map(swap));
  S.working = new Set([...S.working].map(swap));
  renderTagPanel();
  status(`Renamed to “${to}”`, "saved");
}
async function deleteTag(id) {
  const used = usage().get(id) || 0;
  if (used) { status(`“${leaf(id)}” is on ${used} image(s) — untick it there first, or rename it instead`, "err"); return; }
  const next = S.customTags.filter((t) => t !== id && !t.startsWith(id + "/"));
  const r = await api("/api/custom-tags", { tags: next });
  S.customTags = r.customTags;
  uncheck(id);
  renderTagPanel();
}

/* ───────────────────────── modes / queue ───────────────────────── */
function isTagged(p) { return S.records.has(p); }
function buildQueue() {
  const all = S.images.map((i) => i.path);
  if (S.mode === "todo") return all.filter((p) => !isTagged(p));
  if (S.mode === "review") return filteredReview();
  return all;
}
function filteredReview() {
  const q = S.reviewText.toLowerCase();
  return S.images.map((i) => i.path).filter((p) => {
    if (!isTagged(p)) return false;
    const tags = S.records.get(p);
    for (const f of S.tagFilter) if (!tags.includes(f)) return false;
    if (!q) return true;
    return p.toLowerCase().includes(q) || tags.some((t) => t.toLowerCase().includes(q));
  });
}
function setMode(mode) {
  S.mode = mode;
  document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
  S.queue = buildQueue();
  S.idx = 0;
  if (mode === "review") { S.inGrid = true; S.reviewPage = 0; }
  render();
  if (mode !== "review") openAt(0);
}
function openAt(i) {
  S.queue = S.mode === "review" ? filteredReview() : S.queue;
  S.idx = Math.max(0, Math.min(i, S.queue.length - 1));
  S.current = S.queue[S.idx] || null;
  if (S.current) {
    S.working = new Set(isTagged(S.current) ? S.records.get(S.current) : folderTagsFor(S.current));
    S.dirty = false;
    // expand to show the image's own folder and whatever it's tagged with
    [...S.working].forEach((t) => ancestors(t).forEach((a) => S.expanded.add(a)));
    folderTagsFor(S.current).forEach((a) => S.expanded.add(a));
  }
  render();
}

/* ───────────────────────── actions ───────────────────────── */
async function save({ advance = true } = {}) {
  if (!S.current) return;
  const p = S.current;
  const tags = [...S.working].sort(collator.compare);
  status("Saving…");
  try {
    await api("/api/tag", { path: p, tags });
  } catch (e) { status("Save failed: " + e.message, "err"); return; }
  S.records.set(p, tags);
  S.lastSaved = tags;
  S.lastSavedPath = p;
  S.dirty = false;
  status(`Saved ${leaf(p)}`, "saved");
  if (S.mode === "todo") {
    S.queue = buildQueue();                // saved image drops out of the queue
    openAt(S.idx);                         // …so the same index is now the next one
  } else if (advance) {
    openAt(S.idx + 1 < S.queue.length ? S.idx + 1 : S.idx);
  } else render();
}
async function untag() {
  if (!S.current || !isTagged(S.current)) return;
  await api("/api/untag", { path: S.current });
  S.records.delete(S.current);
  status(`${leaf(S.current)} moved back to To tag`, "saved");
  if (S.mode === "review") { S.inGrid = true; S.queue = filteredReview(); render(); }
  else openAt(S.idx);
}
async function move(delta) {
  if (!S.current) return;
  // outside To tag, moving on keeps your edits instead of dropping them
  if (S.dirty && S.mode !== "todo" && isTagged(S.current)) await save({ advance: false });
  openAt(S.idx + delta);
}
function copyLast() {
  if (!S.lastSaved || !S.current) return;
  // bring over the last image's tags, but swap its own folder chain for this image's
  const lastOwn = new Set(folderTagsFor(S.lastSavedPath || ""));
  S.working = new Set([...folderTagsFor(S.current), ...S.lastSaved.filter((t) => !lastOwn.has(t))]);
  [...S.working].forEach((t) => ancestors(t).forEach((a) => S.working.add(a)));
  markDirty();
  renderTagPanel();
}

/* ───────────────────────── render ───────────────────────── */
function render() {
  const total = S.images.length;
  const done = S.images.filter((i) => isTagged(i.path)).length;
  $("bar").style.width = total ? (100 * done) / total + "%" : 0;
  $("progressText").textContent = `${done} / ${total} tagged`;
  $("nTodo").textContent = total - done;
  $("nDone").textContent = done;
  $("nAll").textContent = total;

  const showGrid = S.mode === "review" && S.inGrid;
  $("review").classList.toggle("hidden", !showGrid);
  $("editor").classList.toggle("hidden", showGrid);
  if (showGrid) return renderGrid();
  renderEditor();
}

function renderEditor() {
  const view = $("view");
  $("backToGrid").classList.toggle("hidden", S.mode !== "review");
  if (!S.current) {
    const msg = S.mode === "todo"
      ? `<div class="banner done"><b>Everything is tagged.</b> ${S.images.length} images in tags.json. Use <b>Review tagged</b> to go back over them.</div>`
      : `<div class="banner">No images here.</div>`;
    view.innerHTML = msg;
    ["fileName", "dirName", "pos"].forEach((id) => ($(id).textContent = ""));
    $("stateBadge").className = "hidden";
    ["prevBtn", "nextBtn", "saveBtn", "copyBtn"].forEach((id) => ($(id).disabled = true));
    $("untagBtn").classList.add("hidden");
    $("tree").innerHTML = ""; $("selected").innerHTML = ""; $("quick").innerHTML = "";
    return;
  }
  const img = S.images.find((i) => i.path === S.current) || { path: S.current, ext: "", previewable: false };
  $("fileName").textContent = leaf(img.path);
  $("dirName").textContent = folderOf(img.path);
  $("dirName").title = img.path;
  $("pos").textContent = `${S.idx + 1} / ${S.queue.length}`;
  ["prevBtn", "nextBtn", "saveBtn"].forEach((id) => ($(id).disabled = false));
  $("prevBtn").disabled = S.idx === 0;
  $("nextBtn").disabled = S.idx >= S.queue.length - 1;
  $("nextBtn").firstChild.textContent = S.mode === "todo" ? "Skip → " : "Next → ";
  $("copyBtn").disabled = !S.lastSaved;
  $("untagBtn").classList.toggle("hidden", !isTagged(S.current));

  view.innerHTML = img.previewable
    ? `<img src="${imgUrl(img.path)}" alt="${esc(leaf(img.path))}" />`
    : `<div class="noprev"><div class="ext">${esc(img.ext.replace(".", "").toUpperCase())}</div>
         <div>Your browser can't preview ${esc(img.ext)} files.</div>
         <button class="btn" id="openExt">Open in default app</button></div>`;
  const o = $("openExt");
  if (o) o.onclick = () => api("/api/open", { path: img.path }).catch((e) => status(e.message, "err"));
  // preload the next image so moving on feels instant
  const nxt = S.images.find((i) => i.path === S.queue[S.idx + 1]);
  if (nxt && nxt.previewable) new Image().src = imgUrl(nxt.path);

  renderBadge();
  renderTagPanel();
}

function renderBadge() {
  const b = $("stateBadge");
  if (!S.current) return;
  if (S.dirty) { b.className = "badge dirty"; b.textContent = "unsaved changes"; }
  else if (isTagged(S.current)) { b.className = "badge tagged"; b.textContent = "tagged"; }
  else { b.className = "badge"; b.textContent = "not tagged yet"; }
}

function chip(t, { removable = false, quick = false } = {}) {
  const kind = folderSet().has(t) ? "folder" : "custom";
  const p = parentOf(t);
  return `<span class="chip ${kind} ${quick ? "quick" : ""} ${quick && S.working.has(t) ? "on" : ""}" data-tag="${esc(t)}" title="${esc(t)}">
    ${p ? `<span class="p">${esc(leaf(p))} ›</span>` : ""}${esc(leaf(t))}
    ${removable ? `<button data-remove="${esc(t)}" aria-label="Remove ${esc(t)}">×</button>` : ""}</span>`;
}

function renderTagPanel() {
  // selected: show only the deepest tags — parents are implied and shown in the tree
  const sel = [...S.working].filter((t) => ![...S.working].some((o) => o.startsWith(t + "/"))).sort(collator.compare);
  $("selected").innerHTML = sel.length ? sel.map((t) => chip(t, { removable: true })).join("") : `<span class="empty">No tags</span>`;

  // quick: most used non-folder tags
  const u = usage();
  const quick = [...u.entries()].filter(([t]) => !folderSet().has(t))
    .sort((a, b) => b[1] - a[1]).slice(0, 12).map(([t]) => t);
  $("quickSec").classList.toggle("hidden", !quick.length);
  $("quick").innerHTML = quick.map((t) => chip(t, { quick: true })).join("");

  // tree
  const q = $("tagSearch").value.trim().toLowerCase();
  const ids = allTagIds();
  const own = new Set(folderTagsFor(S.current || ""));
  let visible = null;
  if (q) {
    visible = new Set();
    for (const id of ids) if (leaf(id).toLowerCase().includes(q)) { visible.add(id); ancestors(id).forEach((a) => visible.add(a)); }
  }
  const fs = folderSet();
  const html = [];
  const walk = (nodes) => {
    for (const n of nodes) {
      if (visible && !visible.has(n.id)) continue;
      const open = q ? true : S.expanded.has(n.id);
      const hasKids = n.children.length > 0;
      const isFolder = fs.has(n.id);
      const matched = q && leaf(n.id).toLowerCase().includes(q);
      html.push(`<div class="node ${own.has(n.id) ? "own" : ""} ${matched ? "match" : ""}">
        <button class="twist ${hasKids ? "" : "leaf"}" data-twist="${esc(n.id)}" aria-label="${open ? "Collapse" : "Expand"}">${open ? "▾" : "▸"}</button>
        <label><input type="checkbox" data-check="${esc(n.id)}" ${S.working.has(n.id) ? "checked" : ""} />
          <span class="ico">${isFolder ? "📁" : "🏷️"}</span><span class="name" title="${esc(n.id)}">${esc(leaf(n.id))}</span>
          <span class="count">${u.get(n.id) || ""}</span></label>
        <span class="acts">
          <button data-add="${esc(n.id)}" title="Add a tag inside “${esc(leaf(n.id))}”">+ child</button>
          ${isFolder ? "" : `<button data-rename="${esc(n.id)}" title="Rename">✎</button><button data-del="${esc(n.id)}" title="Delete tag">🗑</button>`}
        </span></div>`);
      if (S.addingUnder === n.id) html.push(newTagRow(n.id));
      if (hasKids && open) { html.push(`<div class="children">`); walk(n.children); html.push(`</div>`); }
    }
  };
  if (S.addingUnder === "") html.push(newTagRow(""));
  walk(buildTree(ids));
  if (q && !ids.some((id) => leaf(id).toLowerCase() === q)) {
    html.push(`<div class="newtag" style="padding-left:6px"><button class="btn" data-create-top="1" style="padding:4px 10px;font-size:12px">+ Create “${esc($("tagSearch").value.trim())}” as a top-level tag</button></div>`);
  }
  $("tree").innerHTML = html.join("");
  const ni = $("newTagInput");
  if (ni) ni.focus();
}
function newTagRow(parent) {
  return `<div class="newtag"><input id="newTagInput" data-parent="${esc(parent)}" placeholder="${parent ? `New tag inside ${esc(leaf(parent))}` : "New top-level tag"} — Enter to add" /></div>`;
}

function renderGrid() {
  const list = filteredReview();
  S.queue = list;
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  S.reviewPage = Math.min(S.reviewPage, pages - 1);
  const slice = list.slice(S.reviewPage * PAGE, (S.reviewPage + 1) * PAGE);
  $("reviewCount").textContent = `${list.length} image${list.length === 1 ? "" : "s"}`;
  $("activeFilters").innerHTML = [...S.tagFilter].map((t) => chip(t, { removable: true }).replace("data-remove", "data-unfilter")).join("");
  $("grid").innerHTML = slice.length ? slice.map((p, i) => {
    const img = S.images.find((x) => x.path === p);
    const tags = S.records.get(p) || [];
    const deepest = tags.filter((t) => !tags.some((o) => o.startsWith(t + "/")));
    return `<button class="card" data-open="${S.reviewPage * PAGE + i}" title="${esc(p)}">
      <div class="thumb">${img && img.previewable ? `<img loading="lazy" decoding="async" src="${imgUrl(p)}" alt="" />` : `<span class="ext">${esc((img?.ext || "").replace(".", "").toUpperCase())}</span>`}</div>
      <div class="meta"><div class="fn">${esc(leaf(p))}</div><div class="chips">${deepest.map((t) => chip(t)).join("")}</div></div></button>`;
  }).join("") : `<div class="banner">${S.records.size ? "Nothing matches these filters." : "Nothing tagged yet — start in <b>To tag</b>."}</div>`;
  $("pager").innerHTML = pages > 1
    ? `<button class="btn" data-page="${S.reviewPage - 1}" ${S.reviewPage === 0 ? "disabled" : ""}>← Prev</button>
       <span class="pos">Page ${S.reviewPage + 1} / ${pages}</span>
       <button class="btn" data-page="${S.reviewPage + 1}" ${S.reviewPage >= pages - 1 ? "disabled" : ""}>Next →</button>` : "";
  $("grid").scrollTop = 0;
}

/* ───────────────────────── events ───────────────────────── */
document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-mode]");
  if (b) setMode(b.dataset.mode);
});
$("prevBtn").onclick = () => move(-1);
$("nextBtn").onclick = () => move(1);
$("saveBtn").onclick = () => save();
$("copyBtn").onclick = copyLast;
$("untagBtn").onclick = untag;
$("backToGrid").onclick = async () => { if (S.dirty) await save({ advance: false }); S.inGrid = true; render(); };
$("expandAll").onclick = () => { allTagIds().forEach((t) => S.expanded.add(t)); renderTagPanel(); };
$("collapseAll").onclick = () => { S.expanded.clear(); renderTagPanel(); };
$("newRootTag").onclick = () => { S.addingUnder = ""; renderTagPanel(); };
$("tagSearch").addEventListener("input", renderTagPanel);
$("tagSearch").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    const q = e.target.value.trim().toLowerCase();
    if (!q) return;
    const hit = allTagIds().find((id) => leaf(id).toLowerCase() === q) || allTagIds().find((id) => leaf(id).toLowerCase().includes(q));
    if (hit) { check(hit); e.target.value = ""; renderTagPanel(); } else createTag("", e.target.value);
  }
  if (e.key === "Escape") { e.target.value = ""; e.target.blur(); renderTagPanel(); }
});

$("tree").addEventListener("click", (e) => {
  const t = e.target;
  if (t.dataset.twist) { S.expanded.has(t.dataset.twist) ? S.expanded.delete(t.dataset.twist) : S.expanded.add(t.dataset.twist); renderTagPanel(); }
  else if (t.dataset.add !== undefined) { S.addingUnder = t.dataset.add; S.expanded.add(t.dataset.add); renderTagPanel(); }
  else if (t.dataset.rename) renameTag(t.dataset.rename).catch((err) => status(err.message, "err"));
  else if (t.dataset.del) deleteTag(t.dataset.del).catch((err) => status(err.message, "err"));
  else if (t.dataset.createTop) createTag("", $("tagSearch").value);
});
$("tree").addEventListener("change", (e) => { if (e.target.dataset.check) toggle(e.target.dataset.check); });
$("tree").addEventListener("keydown", (e) => {
  if (e.target.id !== "newTagInput") return;
  if (e.key === "Enter") { e.preventDefault(); createTag(e.target.dataset.parent, e.target.value).catch((err) => status(err.message, "err")); }
  if (e.key === "Escape") { S.addingUnder = undefined; renderTagPanel(); }
});
$("selected").addEventListener("click", (e) => { if (e.target.dataset.remove) { uncheck(e.target.dataset.remove); renderTagPanel(); } });
$("quick").addEventListener("click", (e) => { const c = e.target.closest("[data-tag]"); if (c) toggle(c.dataset.tag); });

$("reviewSearch").addEventListener("input", (e) => { S.reviewText = e.target.value; S.reviewPage = 0; renderGrid(); });
$("grid").addEventListener("click", (e) => {
  const chipEl = e.target.closest(".chip[data-tag]");
  if (chipEl) { e.stopPropagation(); S.tagFilter.add(chipEl.dataset.tag); S.reviewPage = 0; renderGrid(); return; }
  const card = e.target.closest("[data-open]");
  if (card) { S.inGrid = false; openAt(Number(card.dataset.open)); }
});
$("activeFilters").addEventListener("click", (e) => { if (e.target.dataset.unfilter) { S.tagFilter.delete(e.target.dataset.unfilter); renderGrid(); } });
$("pager").addEventListener("click", (e) => { const b = e.target.closest("[data-page]"); if (b && !b.disabled) { S.reviewPage = Number(b.dataset.page); renderGrid(); } });

document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) && document.activeElement.type !== "checkbox";
  if (typing) return;
  if (S.mode === "review" && S.inGrid) return;
  if (e.key === "Enter") { e.preventDefault(); save(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); move(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
  else if (e.key.toLowerCase() === "c" && !e.ctrlKey && !e.metaKey) copyLast();
  else if (e.key === "/") { e.preventDefault(); $("tagSearch").focus(); }
});
window.addEventListener("beforeunload", (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });

load().catch((e) => status("Could not load: " + e.message, "err"));
</script>
</body>
</html>
